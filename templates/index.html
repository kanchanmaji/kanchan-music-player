<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanchan Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f4f6; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: #ffffff; border: 4px solid #111; box-shadow: 8px 8px 0px #111; padding: 25px; width: 100%; max-width: 500px; border-radius: 12px; margin-bottom: 20px; }
        
        h1 { font-size: 2rem; font-weight: 900; text-align: center; margin-bottom: 5px; text-transform: uppercase; color: #111; letter-spacing: -1px; }
        .credit { text-align: center; font-weight: 700; font-size: 0.9rem; color: #555; border-bottom: 3px dashed #111; padding-bottom: 15px; margin-bottom: 15px; }
        .credit span { color: #111; text-decoration: underline; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #fff; border: 3px solid #111; border-radius: 6px; font-weight: 900; cursor: pointer; box-shadow: 3px 3px 0px #111; transition: 0.1s; }
        .tab-btn.active { background: #111; color: #fff; box-shadow: none; transform: translate(3px, 3px); }

        .utils-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .utils-bar select, .utils-bar label { flex: 1; padding: 10px; border: 3px solid #111; border-radius: 6px; font-weight: 700; font-size: 0.9rem; background: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .utils-bar input[type="checkbox"] { accent-color: #111; width: 16px; height: 16px; }

        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 14px; border: 3px solid #111; border-radius: 8px; font-size: 1rem; font-weight: 700; outline: none; background: #f9f9f9; box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05); }
        input[type="text"]:focus { background: #fffbe6; }
        
        .btn-main { width: 100%; padding: 14px; background: #111; color: #fff; border: 3px solid #111; border-radius: 8px; font-size: 1.1rem; font-weight: 900; cursor: pointer; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 4px 4px 0px #111; transition: 0.1s; }
        .btn-main:active { transform: translate(4px, 4px); box-shadow: none; }

        .status-box { display: none; text-align: center; font-weight: 700; padding: 12px; border: 3px dashed #111; border-radius: 8px; background: #fffbe6; font-size: 0.95rem; margin-bottom: 15px; }
        .error-box { background: #ffc1c1; }
        .info-box { background: #c1e1ff; }

        /* Player UI */
        #player-section { display: none; margin-top: 10px; border-top: 4px solid #111; padding-top: 20px; }
        .art-container { position: relative; width: 100%; aspect-ratio: 16/9; margin-bottom: 15px; border: 4px solid #111; border-radius: 12px; overflow: hidden; box-shadow: 6px 6px 0px #111; background: #000; }
        img.thumb { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; position: absolute; top: 0; left: 0; z-index: 1; }
        video#media-player { width: 100%; height: 100%; background: #000; position: absolute; top: 0; left: 0; z-index: 2; display: none; }
        
        .track-info { text-align: center; margin-bottom: 20px; }
        .track-title { font-weight: 900; font-size: 1.3rem; color: #111; line-height: 1.2; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .track-artist { font-weight: 700; font-size: 0.95rem; color: #666; }

        /* Controls */
        .controls-grid { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .ctrl-btn { width: 45px; height: 45px; background: #fff; border: 3px solid #111; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 3px 3px 0px #111; transition: 0.1s; }
        .ctrl-btn:active { transform: translate(3px, 3px); box-shadow: none; }
        .ctrl-btn svg { width: 20px; height: 20px; fill: #111; }
        .ctrl-play { width: 60px; height: 60px; background: #c6ffc1; }
        .ctrl-play svg { width: 26px; height: 26px; }
        .ctrl-btn.active { background: #111; }
        .ctrl-btn.active svg { fill: #fff; }

        /* Queue & History Lists */
        .list-container { max-height: 300px; overflow-y: auto; border: 3px solid #111; border-radius: 8px; background: #fafafa; border-bottom: none; }
        .list-item { display: flex; gap: 12px; align-items: center; padding: 10px; border-bottom: 3px solid #111; cursor: pointer; transition: 0.1s; }
        .list-item:hover { background: #eee; }
        .list-item.playing { background: #fffbe6; }
        .list-item.playing .item-title { color: #d32f2f; }
        
        .item-thumb { width: 60px; height: 45px; border: 2px solid #111; border-radius: 4px; object-fit: cover; background: #000; flex-shrink: 0; }
        .item-text { flex: 1; overflow: hidden; }
        .item-title { font-weight: 800; font-size: 0.9rem; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-sub { font-weight: 700; font-size: 0.75rem; color: #666; }
        
        .history-btn { font-size: 0.8rem; padding: 6px 10px; background: #111; color: #fff; border: 2px solid #111; border-radius: 4px; font-weight: 800; }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #eee; border-left: 2px solid #111; }
        ::-webkit-scrollbar-thumb { background: #111; }

        #history-section { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Kanchan Player</h1>
        <div class="credit">Made by <span>Kanchan</span></div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-player" onclick="switchTab('player')">Player</button>
            <button class="tab-btn" id="tab-history" onclick="switchTab('history')">Quick Play</button>
        </div>
        
        <div class="utils-bar" id="utils-section">
            <label title="Play Video (Max 720p)">
                <input type="checkbox" id="video-mode-toggle" onchange="toggleVideoMode()"> Video Mode
            </label>
            <select id="sleep-timer" onchange="setSleepTimer()">
                <option value="0">Sleep: OFF</option>
                <option value="15">Sleep: 15 Min</option>
                <option value="30">Sleep: 30 Min</option>
                <option value="60">Sleep: 60 Min</option>
            </select>
        </div>

        <div id="status" class="status-box"></div>

        <!-- SEARCH SECTION -->
        <div id="search-section">
            <div class="input-group">
                <input type="text" id="query" placeholder="Search song or paste playlist URL..." autocomplete="off">
                <button class="btn-main" onclick="loadMedia()">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M10 2a8 8 0 105.29 14.71l5 5a1 1 0 001.42-1.42l-5-5A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
                    Load Media
                </button>
            </div>
        </div>

        <!-- THE PLAYER -->
        <div id="player-section">
            <div class="art-container">
                <img id="thumb-img" class="thumb" src="" alt="Thumbnail">
                <!-- Dedicated Audio for background survival -->
                <audio id="audio-player" preload="auto"></audio>
                <video id="media-player" playsinline controlsList="nodownload"></video>
            </div>
            
            <div class="track-info">
                <div class="track-title" id="track-title">--</div>
                <div class="track-artist" id="track-artist">--</div>
            </div>
            
            <div class="controls-grid">
                <button class="ctrl-btn" onclick="toggleShuffle()" id="shuffle-btn" title="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn ctrl-play" id="play-pause-btn" onclick="togglePlay()">
                    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="nextTrack()" title="Next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="toggleRepeatMode()" id="repeat-btn" title="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="downloadCurrent()" id="download-btn" title="Download Audio">
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </button>
            </div>

            <div style="font-weight: 900; margin-bottom: 8px; font-size: 0.9rem; color: #111;">CURRENT QUEUE</div>
            <div class="list-container" id="playlist-list"></div>
        </div>

        <!-- HISTORY SECTION -->
        <div id="history-section">
            <div style="font-weight: 900; margin-bottom: 8px; font-size: 0.9rem; color: #111;">YOUR QUICK PLAY</div>
            <div class="list-container" id="history-list" style="border-bottom: 3px solid #111;"></div>
        </div>

    </div>

    <script>
        const videoPlayer = document.getElementById('media-player');
        const audioPlayer = document.getElementById('audio-player');
        let player = audioPlayer; // Default to audio to survive lock screen
        
        let originalPlaylist = [];
        let playlist = [];
        let currentIndex = 0;
        let repeatMode = 'OFF'; 
        let isShuffled = false;
        let sleepTimerId = null;
        
        // Memory Cache for instant track switching
        let streamCache = {};
        let isPrefetching = false;

        const iconPlay = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        const iconPause = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

        document.addEventListener("DOMContentLoaded", renderHistory);

        function switchTab(tab) {
            document.getElementById('tab-player').classList.remove('active');
            document.getElementById('tab-history').classList.remove('active');
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('player-section').style.display = 'none';
            document.getElementById('history-section').style.display = 'none';
            
            if (tab === 'player') {
                document.getElementById('tab-player').classList.add('active');
                document.getElementById('search-section').style.display = 'block';
                if (playlist.length > 0) document.getElementById('player-section').style.display = 'block';
            } else {
                document.getElementById('tab-history').classList.add('active');
                document.getElementById('history-section').style.display = 'block';
                renderHistory();
            }
        }
        
        function setSleepTimer() {
            const minutes = parseInt(document.getElementById('sleep-timer').value);
            if (sleepTimerId) clearTimeout(sleepTimerId);
            
            const status = document.getElementById("status");
            
            if (minutes === 0) {
                status.style.display = "none";
                return;
            }
            
            status.style.display = "block";
            status.className = "status-box info-box";
            status.innerText = `Sleep timer set for ${minutes} minutes.`;
            
            sleepTimerId = setTimeout(() => {
                player.pause();
                document.getElementById("play-pause-btn").innerHTML = iconPlay;
                status.className = "status-box info-box";
                status.innerText = "Playback stopped by sleep timer.";
            }, minutes * 60000);
            
            setTimeout(() => {
                if(status.innerText.includes("set for")) status.style.display = "none";
            }, 3000);
        }

        function toggleVideoMode() {
            const isVideo = document.getElementById('video-mode-toggle').checked;
            const wasPlaying = !player.paused;
            const currentTime = player.currentTime;
            
            player.pause(); // Pause old player
            
            if (isVideo) {
                videoPlayer.style.display = 'block';
                player = videoPlayer;
            } else {
                videoPlayer.style.display = 'none';
                player = audioPlayer;
            }

            // If a track was loaded, we must reload the stream in correct format
            if (playlist.length > 0) {
                playTrack(currentIndex, currentTime);
            }
        }

        async function fetchStreamData(trackId, mode) {
            // Use cache for fast track switching
            if (mode === 'audio' && streamCache[trackId]) {
                return streamCache[trackId];
            }
            
            const res = await fetch("/api/stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ video_id: trackId, mode: mode })
            });

            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || "Stream extraction blocked.");
            
            if (mode === 'audio') streamCache[trackId] = data.stream_url;
            return data.stream_url;
        }

        // PREFETCH LOGIC: Fetch next track 15 seconds before current ends
        function handleTimeUpdate() {
            if (!player.duration || isPrefetching) return;
            const timeLeft = player.duration - player.currentTime;
            
            if (timeLeft < 15 && currentIndex < playlist.length - 1) {
                const nextTrack = playlist[currentIndex + 1];
                const mode = document.getElementById('video-mode-toggle').checked ? 'video' : 'audio';
                
                if (mode === 'audio' && !streamCache[nextTrack.id]) {
                    isPrefetching = true;
                    fetchStreamData(nextTrack.id, mode)
                        .catch(e => console.error("Prefetch failed:", e))
                        .finally(() => isPrefetching = false);
                }
            }
        }

        audioPlayer.addEventListener('timeupdate', handleTimeUpdate);
        videoPlayer.addEventListener('timeupdate', handleTimeUpdate);

        const handleTrackEnd = () => {
            if (repeatMode === 'ONE') {
                player.currentTime = 0;
                player.play();
            } else if (currentIndex < playlist.length - 1) {
                playTrack(currentIndex + 1);
            } else if (repeatMode === 'ALL') {
                playTrack(0);
            } else {
                document.getElementById("play-pause-btn").innerHTML = iconPlay;
            }
        };

        audioPlayer.onended = handleTrackEnd;
        videoPlayer.onended = handleTrackEnd;

        async function loadMedia(historyQuery = null, historyTitle = null) {
            const query = historyQuery || document.getElementById("query").value.trim();
            if (!query) return alert("Input cannot be empty.");

            const status = document.getElementById("status");
            const playerSection = document.getElementById("player-section");

            status.style.display = "block";
            status.className = "status-box";
            status.innerText = "Parsing media metadata... Please wait.";
            playerSection.style.display = "none";
            player.pause();

            try {
                const res = await fetch("/api/parse", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                });
                
                const data = await res.json();
                if (!res.ok || data.error) throw new Error(data.error || "Parse failed.");

                originalPlaylist = [...data.tracks];
                playlist = [...data.tracks];
                streamCache = {}; // Clear old cache for new search
                
                if (playlist.length === 0) throw new Error("No playable tracks found.");

                saveToHistory(query, historyTitle || data.source_title || query, data.tracks[0].thumbnail);

                isShuffled = false;
                document.getElementById("shuffle-btn").classList.remove("active");
                
                renderPlaylistUI();
                status.style.display = "none";
                switchTab('player');
                
                playTrack(0);

            } catch (err) {
                status.className = "status-box error-box";
                status.innerText = err.message || "Network failure.";
            }
        }

        async function playTrack(index, resumeTime = 0) {
            if (index < 0 || index >= playlist.length) return;
            
            currentIndex = index;
            const track = playlist[currentIndex];
            const status = document.getElementById("status");
            const isVideo = document.getElementById('video-mode-toggle').checked;
            
            status.style.display = "block";
            status.className = "status-box";
            status.innerText = `Extracting Google Stream for: ${track.title}...`;

            document.getElementById("track-title").innerText = track.title;
            document.getElementById("track-artist").innerText = track.artist;
            document.getElementById("thumb-img").src = track.thumbnail;
            
            highlightPlaylistItem();
            setupMediaSession(track);

            try {
                const streamUrl = await fetchStreamData(track.id, isVideo ? 'video' : 'audio');
                status.style.display = "none";

                player.src = streamUrl;
                if (resumeTime > 0) player.currentTime = resumeTime;
                
                player.play().then(() => {
                    document.getElementById("play-pause-btn").innerHTML = iconPause;
                }).catch(e => console.error("Autoplay blocked:", e));

            } catch (err) {
                status.className = "status-box error-box";
                status.innerText = "Stream extraction failed. Skipping...";
                setTimeout(() => nextTrack(), 2000);
            }
        }
        
        function downloadCurrent() {
            if (playlist.length === 0 || !playlist[currentIndex]) return alert("No track selected.");
            const track = playlist[currentIndex];
            window.open(`/api/download?video_id=${encodeURIComponent(track.id)}`, '_blank');
        }

        function togglePlay() {
            if (!player.src) return;
            if (player.paused) {
                player.play();
                document.getElementById("play-pause-btn").innerHTML = iconPause;
            } else {
                player.pause();
                document.getElementById("play-pause-btn").innerHTML = iconPlay;
            }
        }

        function nextTrack() {
            if (currentIndex < playlist.length - 1) playTrack(currentIndex + 1);
            else if (repeatMode === 'ALL') playTrack(0);
        }

        function prevTrack() {
            if (player.currentTime > 3) {
                player.currentTime = 0; 
                player.play();
            } else if (currentIndex > 0) {
                playTrack(currentIndex - 1);
            }
        }

        function toggleRepeatMode() {
            const btn = document.getElementById("repeat-btn");
            if (repeatMode === 'OFF') {
                repeatMode = 'ALL';
                btn.classList.add("active");
            } else if (repeatMode === 'ALL') {
                repeatMode = 'ONE';
                btn.style.borderColor = "#d32f2f"; 
            } else {
                repeatMode = 'OFF';
                btn.classList.remove("active");
                btn.style.borderColor = "#111";
            }
        }

        function toggleShuffle() {
            const btn = document.getElementById("shuffle-btn");
            if (!isShuffled) {
                const currentTrack = playlist[currentIndex];
                let shuffled = [...originalPlaylist];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                playlist = shuffled;
                currentIndex = playlist.findIndex(t => t.id === currentTrack.id);
                isShuffled = true;
                btn.classList.add("active");
            } else {
                const currentTrack = playlist[currentIndex];
                playlist = [...originalPlaylist];
                currentIndex = playlist.findIndex(t => t.id === currentTrack.id);
                isShuffled = false;
                btn.classList.remove("active");
            }
            renderPlaylistUI();
            highlightPlaylistItem();
        }

        function renderPlaylistUI() {
            const container = document.getElementById("playlist-list");
            container.innerHTML = "";
            playlist.forEach((track, idx) => {
                const item = document.createElement("div");
                item.className = "list-item";
                item.id = `q-item-${idx}`;
                item.onclick = () => playTrack(idx);
                item.innerHTML = `
                    <img src="${track.thumbnail}" class="item-thumb">
                    <div class="item-text">
                        <div class="item-title">${idx + 1}. ${track.title}</div>
                        <div class="item-sub">${track.artist}</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function highlightPlaylistItem() {
            const items = document.querySelectorAll("#playlist-list .list-item");
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add("playing");
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove("playing");
                }
            });
        }

        function saveToHistory(query, title, thumbnail) {
            let history = JSON.parse(localStorage.getItem('kanchan_history')) || [];
            history = history.filter(h => h.query !== query);
            history.unshift({ query, title, thumbnail });
            if (history.length > 15) history.pop(); 
            localStorage.setItem('kanchan_history', JSON.stringify(history));
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('kanchan_history')) || [];
            const container = document.getElementById("history-list");
            container.innerHTML = "";
            
            if (history.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; font-weight: 700; color: #666;">No history yet.</div>`;
                return;
            }

            history.forEach(item => {
                const div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `
                    <img src="${item.thumbnail}" class="item-thumb">
                    <div class="item-text">
                        <div class="item-title">${item.title}</div>
                        <div class="item-sub">${item.query.startsWith('http') ? 'Playlist / Link' : 'Search Query'}</div>
                    </div>
                    <button class="history-btn" onclick="loadMedia('${item.query}', '${item.title.replace(/'/g, "\\'")}')">PLAY</button>
                `;
                container.appendChild(div);
            });
        }

        function setupMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: track.artist,
                    album: 'Kanchan Player',
                    artwork: [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', togglePlay);
                navigator.mediaSession.setActionHandler('pause', togglePlay);
                navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
            }
        }
    </script>
</body>
</html>
